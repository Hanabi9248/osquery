name: Publish verified Linux Homebrew contribution
on:
  push:
    branches: [codex/publish-linux-homebrew]
    paths: [.github/workflows/publish-linux-homebrew.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Publish exact tested source tree
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = Hanabi9248/osquery
          branch=codex/linux-homebrew-packages
          test -z "$(git ls-remote --heads origin refs/heads/$branch)"
          git checkout --detach 41aee73b02fb519ee34fe61a7a11a35e85d9d63c
          printf '%s' '' | base64 -d > /tmp/homebrew.patch
          git apply --index /tmp/homebrew.patch
          test "$(git write-tree)" = cbdaf06f8c5c136831d7a1ed99a9887c71120f9f
          git config user.name Hanabi
          git config user.email 317387557+Hanabi9248@users.noreply.github.com
          git commit -s -m 'Enable homebrew_packages on Linux'
          git push origin HEAD:refs/heads/$branch
